# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    # Treat unawaited futures as errors — prevents silent async bugs
    unawaited_futures: error
    # Treat discarded futures as errors
    discarded_futures: error

linter:
  rules:
    # ── Correctness ────────────────────────────────────────────────────────
    avoid_print: true               # Use a proper logger instead
    unawaited_futures: true         # Must await or explicitly unawaited()
    discarded_futures: true         # Discard must be explicit
    cancel_subscriptions: true      # StreamSubscription must be cancelled
    close_sinks: true               # Sinks must be closed

    # ── Style & consistency ────────────────────────────────────────────────
    prefer_single_quotes: true      # Uniform quote style
    always_declare_return_types: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_locals: true       # Immutable-first locals
    unnecessary_lambdas: true       # Prefer tear-offs where possible

    # ── Null safety ────────────────────────────────────────────────────────
    # (avoid_null_checks_in_equality_operators is deprecated in Dart 3)


    # ── Flutter specifics ─────────────────────────────────────────────────
    use_key_in_widget_constructors: true
    sized_box_for_whitespace: true  # Prefer SizedBox over Container for spacing
    avoid_unnecessary_containers: true

# Additional information:
# https://dart.dev/guides/language/analysis-options
