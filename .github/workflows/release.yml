name: Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Secret scan before any build runs ───────────────────────────────────────
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build Android APKs
    needs: [secret-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis (fatal infos)
        run: flutter analyze --fatal-infos

      - name: Run unit tests
        run: flutter test 

      - name: Configure Keystore
        if: env.PLAY_KEYSTORE_BASE64 != ''
        env:
          PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          echo "$PLAY_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat <<EOF > android/key.properties
          storePassword=$PLAY_KEYSTORE_PASSWORD
          keyPassword=$PLAY_KEY_PASSWORD
          keyAlias=$PLAY_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build Split APKs
        run: flutter build apk --split-per-abi --dart-define=ENABLE_EXTERNAL_DONATIONS=true

      - name: Build Universal Release APK
        run: flutter build apk --release --dart-define=ENABLE_EXTERNAL_DONATIONS=true

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Rename APKs and App Bundle
        run: |
          VERSION=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)
          echo "App version: $VERSION"
          cd build/app/outputs/flutter-apk
          for f in app*.apk; do
            [ -f "$f" ] && mv "$f" "${f/#app/cashflow}"
          done
          ls -la
          cd -
          cd build/app/outputs/bundle/release
          if [ -f "app-release.aab" ]; then
            cp app-release.aab cashflow-release.aab
          fi
          ls -la

      - name: Stage Release Artifacts Flat
        run: |
          VERSION=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)
          mkdir -p build/dist
          cd build/app/outputs/flutter-apk
          for f in cashflow*.apk; do
            if [ -f "$f" ]; then
              cp "$f" "$GITHUB_WORKSPACE/build/dist/$f"
              # Create versioned copy, e.g. cashflow-v4.0.0-release.apk or cashflow-v4.0.0-arm64-v8a-release.apk
              versioned_name=$(echo "$f" | sed "s/^cashflow-/cashflow-v${VERSION}-/")
              cp "$f" "$GITHUB_WORKSPACE/build/dist/$versioned_name"
            fi
          done
          cd -
          cd build/app/outputs/bundle/release
          if [ -f "cashflow-release.aab" ]; then
            cp cashflow-release.aab "$GITHUB_WORKSPACE/build/dist/cashflow-release.aab"
            cp cashflow-release.aab "$GITHUB_WORKSPACE/build/dist/cashflow-v${VERSION}-release.aab"
          fi
          cd -
          ls -la build/dist/

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: build/dist/*
          retention-days: 1

