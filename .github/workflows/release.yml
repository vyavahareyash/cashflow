name: Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test -j 1

      - name: Build Split APKs
        run: flutter build apk --split-per-abi

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Rename APKs with app name
        run: |
          cd build/app/outputs/flutter-apk
          for f in app*.apk; do
            [ -f "$f" ] && mv "$f" "${f/#app/cashflow}"
          done
          ls -la

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/cashflow*.apk
          retention-days: 1

  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release

      - name: Package Web App
        run: |
          cd build/web
          zip -r ../../cashflow-web.zip .
          cd ../..

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: cashflow-web.zip
          retention-days: 1

  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package iOS Payload and IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r cashflow-ios-unsigned.ipa Payload
          zip -r cashflow-ios-app.zip build/ios/iphoneos/Runner.app

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-bundles
          path: |
            cashflow-ios-unsigned.ipa
            cashflow-ios-app.zip
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-web, build-ios]
    if: always() && (needs.build-android.result == 'success' || needs.build-web.result == 'success' || needs.build-ios.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List Release Assets
        run: ls -la release-assets/

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Cashflow ${{ github.ref_name }}"
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
