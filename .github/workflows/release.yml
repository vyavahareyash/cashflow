name: Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test -j 1

      - name: Configure Keystore
        if: env.PLAY_KEYSTORE_BASE64 != ''
        env:
          PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          echo "$PLAY_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat <<EOF > android/key.properties
          storePassword=$PLAY_KEYSTORE_PASSWORD
          keyPassword=$PLAY_KEY_PASSWORD
          keyAlias=$PLAY_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build Split APKs
        run: flutter build apk --split-per-abi

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Rename APKs and App Bundle
        run: |
          cd build/app/outputs/flutter-apk
          for f in app*.apk; do
            [ -f "$f" ] && mv "$f" "${f/#app/cashflow}"
          done
          ls -la
          cd -
          cd build/app/outputs/bundle/release
          if [ -f "app-release.aab" ]; then
            cp app-release.aab cashflow-release.aab
          fi
          ls -la

      - name: Stage Release Artifacts Flat
        run: |
          mkdir -p build/dist
          cp build/app/outputs/flutter-apk/cashflow*.apk build/dist/
          cp build/app/outputs/bundle/release/cashflow-release.aab build/dist/
          ls -la build/dist/

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: build/dist/*
          retention-days: 1

  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release

      - name: Package Web App
        run: |
          cd build/web
          zip -r ../../cashflow-web.zip .
          cd ../..

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: cashflow-web.zip
          retention-days: 1

  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package iOS Payload and IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r cashflow-ios-unsigned.ipa Payload
          zip -r cashflow-ios-app.zip build/ios/iphoneos/Runner.app

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-bundles
          path: |
            cashflow-ios-unsigned.ipa
            cashflow-ios-app.zip
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-web, build-ios]
    if: always() && (needs.build-android.result == 'success' || needs.build-web.result == 'success' || needs.build-ios.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List Release Assets
        run: ls -la release-assets/

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Cashflow ${{ github.ref_name }}"
          files: |
            release-assets/*
            release-assets/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-play-store:
    name: Publish to Google Play Store
    needs: [build-android]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-artifacts
          path: android-artifacts

      - name: Locate AAB
        id: locate-aab
        run: |
          AAB_FILE=$(find android-artifacts -name "*release.aab" | head -n 1)
          if [ -z "$AAB_FILE" ]; then
            echo "Error: No release .aab found" >&2
            exit 1
          fi
          echo "aab_file=$AAB_FILE" >> "$GITHUB_OUTPUT"

      - name: Check Play Store Service Account Secret
        id: check-secret
        run: |
          if [ -z "${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}" ]; then
            echo "has_secret=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON secret is not set. Skipping Play Store upload."
          else
            echo "has_secret=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Google Play (Internal Track)
        if: steps.check-secret.outputs.has_secret == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.vyavahareyash.cashflow
          releaseFiles: ${{ steps.locate-aab.outputs.aab_file }}
          track: internal
          status: completed

